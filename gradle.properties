# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties
# NOTE: these are only the defaults used for local IDE development
# (./gradlew build with no extra flags). The CI workflow
# (.github/workflows/build.yml) overrides every one of these per
# Minecraft version via -P command-line properties, and resolves the
# correct yarn/loader/fabric-api build automatically at build time -
# nothing needs to be hand-edited here to add a new supported version.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod properties
mod_version=1.0.0
maven_group=com.yukile.footfall
archives_base_name=footfall

# The Minecraft version-range string written into fabric.mod.json's
# depends.minecraft field. Overridden per-build in CI so each published
# jar declares the single version it was actually compiled against.
minecraft_dependency=1.21.1

# Dependencies
fabric_version=0.102.0+1.21.1
modmenu_version=11.0.3
